<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} ·
    {% endif %}
    {{ site.title }}
  </title>

  <meta
    name="description"
    content="{{ page.excerpt | default: site.description | strip_html }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/style.css' | relative_url }}"
  >
</head>

<body>

  <header>
    <a class="brand" href="{{ '/' | relative_url }}">
      WJ
      <span>{{ site.title }}</span>
    </a>

    <nav>
      <a href="{{ '/' | relative_url }}">
        首页
      </a>

      <a href="{{ '/#articles' | relative_url }}">
        文章
      </a>

      <a href="{{ '/about/' | relative_url }}">
        关于我
      </a>

      <a
        href="https://github.com/COOLWJ/COOLWJ.github.io/new/main/_posts"
        target="_blank"
        rel="noopener noreferrer"
      >
        发布文章
      </a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    © {{ 'now' | date: '%Y' }} 王举 · 保持好奇，持续记录。
  </footer>

</body>

</html>
