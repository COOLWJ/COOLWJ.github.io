<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body{% if page.layout == 'post' %} class="post-page"{% endif %}>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">WJ<span>{{ site.title }}</span></a>
    <nav>
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/archives/' | relative_url }}">归档</a>
      <a href="{{ '/categories/' | relative_url }}">分类</a>
      <a href="{{ '/tags/' | relative_url }}">标签</a>
      <a href="{{ '/search/' | relative_url }}">搜索</a>
      <a href="{{ '/about/' | relative_url }}">关于我</a>
      <a href="#" id="publish-article" target="_blank" rel="noopener noreferrer">发布文章</a>
    </nav>
  </header>

  <main class="site-main">{{ content }}</main>

  <footer>© {{ 'now' | date: '%Y' }} 王举 · 保持好奇，持续记录。</footer>
  <button class="back-to-top" type="button" aria-label="返回顶部">↑</button>

  <script>

    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    const date = `${year}-${month}-${day}`;
    const filename = `${date}-new-article.md`;
