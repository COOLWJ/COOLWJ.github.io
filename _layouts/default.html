<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} ·
    {% endif %}
    {{ site.title }}
  </title>

  <meta
    name="description"
    content="{{ page.excerpt | default: site.description | strip_html }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/style.css' | relative_url }}"
  >
</head>

<body>

  <header>
    <a class="brand" href="{{ '/' | relative_url }}">
      WJ
      <span>{{ site.title }}</span>
    </a>

    <nav>
      <a href="{{ '/' | relative_url }}">
        首页
      </a>

      <a href="{{ '/#articles' | relative_url }}">
        文章
      </a>

      <a href="{{ '/about/' | relative_url }}">
        关于我
      </a>

      <a
        href="#"
        id="publish-article"
        target="_blank"
        rel="noopener noreferrer"
      >
        发布文章
      </a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    © {{ 'now' | date: '%Y' }} 王举 · 保持好奇，持续记录。
  </footer>

  <script>
    const publishButton = document.getElementById("publish-article");

    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    const date = `${year}-${month}-${day}`;

    const filename = `${date}-new-article.md`;

    const articleTemplate = `---
layout: post
title: "请填写文章标题"
date: ${date}
category: 技术文章
---

这里开始写文章正文。
`;

    publishButton.href =
      "https://github.com/COOLWJ/COOLWJ.github.io/new/main/_posts" +
      "?filename=" + encodeURIComponent(filename) +
      "&value=" + encodeURIComponent(articleTemplate);
  </script>

</body>

</html>
